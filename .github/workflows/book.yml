# Weaves a book with jekyll-literate, for a book's repository to call:
#
#   jobs:
#     site:
#       uses: jonsnyder01/jekyll-literate/.github/workflows/book.yml@main
#       with:
#         cloudflare-project: my-book
#       secrets: inherit
#
# It tangles with Entangled and weaves with `literate build` from the book's
# root (its Gemfile, .ruby-version and _config.yml). Pull requests only build;
# pushes to the default branch also deploy to Cloudflare Pages when
# `cloudflare-project` is set and the CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID secrets exist.
name: Book

on:
  workflow_call:
    inputs:
      entangled-version:
        type: string
        default: "2.5.0"
      destination:
        description: The book's Jekyll destination, as set in its _config.yml.
        type: string
        default: build/site
      cloudflare-project:
        description: Cloudflare Pages project to deploy to; empty to only build.
        type: string
        default: ""
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    env:
      JEKYLL_ENV: production
      # Read here so the deploy step can be skipped until the secret exists.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEPLOY: ${{ inputs.cloudflare-project != '' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # `literate build` tangles first: the source browser lists the tangled files.
      - uses: astral-sh/setup-uv@v10.3.3

      - name: Install Entangled
        run: uv tool install "entangled-cli==${{ inputs.entangled-version }}"

      - name: Build site
        run: bundle exec literate build

      - name: Deploy to Cloudflare Pages
        if: env.DEPLOY == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ inputs.destination }} --project-name=${{ inputs.cloudflare-project }} --branch=${{ github.event.repository.default_branch }} --commit-dirty=true

      - name: Explain skipped deploy
        if: env.DEPLOY == 'true' && env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::CLOUDFLARE_API_TOKEN is not set; site built but not deployed."
