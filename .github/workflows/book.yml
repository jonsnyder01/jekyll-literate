# Weaves a book with jekyll-literate, for a book's repository to call. To
# publish on GitHub Pages (with the repository's Pages source set to GitHub
# Actions):
#
#   jobs:
#     site:
#       uses: jonsnyder01/jekyll-literate/.github/workflows/book.yml@main
#       with:
#         github-pages: true
#       permissions:
#         contents: read
#         pages: write
#         id-token: write
#
# or on Cloudflare Pages:
#
#   jobs:
#     site:
#       uses: jonsnyder01/jekyll-literate/.github/workflows/book.yml@main
#       with:
#         cloudflare-project: my-book
#       secrets: inherit
#
# It tangles with Entangled and weaves with `literate build` from the book's
# root (its Gemfile, .ruby-version and _config.yml). Pull requests only build;
# pushes to the default branch also deploy: to GitHub Pages when
# `github-pages` is set, and to Cloudflare Pages when `cloudflare-project` is
# set and the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets exist.
# The jobs run with the caller's permissions, so GitHub Pages needs the three
# above.
name: Book

on:
  workflow_call:
    inputs:
      entangled-version:
        type: string
        default: "2.5.0"
      destination:
        description: The book's Jekyll destination, as set in its _config.yml.
        type: string
        default: build/site
      github-pages:
        description: Deploy to the repository's GitHub Pages site.
        type: boolean
        default: false
      cloudflare-project:
        description: Cloudflare Pages project to deploy to; empty for none.
        type: string
        default: ""
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

jobs:
  site:
    runs-on: ubuntu-latest
    env:
      JEKYLL_ENV: production
      # Read here so the Cloudflare deploy can be skipped until the secret exists.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEPLOY: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # `literate build` tangles first: the source browser lists the tangled files.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          # Only one pinned tool is installed; there is no lockfile to cache by.
          enable-cache: false

      - name: Install Entangled
        run: uv tool install "entangled-cli==${{ inputs.entangled-version }}"

      # A project site lives under /<repository>/: its base path is the baseurl.
      - name: Configure GitHub Pages
        id: pages
        if: inputs.github-pages
        uses: actions/configure-pages@v6

      - name: Build site
        run: bundle exec literate build ${BASEURL:+--baseurl "$BASEURL"}
        env:
          BASEURL: ${{ steps.pages.outputs.base_path }}

      - name: Upload for GitHub Pages
        if: inputs.github-pages && env.DEPLOY == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ inputs.destination }}

      - name: Deploy to Cloudflare Pages
        if: inputs.cloudflare-project != '' && env.DEPLOY == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ inputs.destination }} --project-name=${{ inputs.cloudflare-project }} --branch=${{ github.event.repository.default_branch }} --commit-dirty=true

      - name: Explain skipped deploy
        if: inputs.cloudflare-project != '' && env.DEPLOY == 'true' && env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::CLOUDFLARE_API_TOKEN is not set; site built but not deployed."

  github-pages:
    needs: site
    if: inputs.github-pages && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
